<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Brick Masters</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">Brick Masters</div>
        <div class="links">
            <a href="index.html">Home</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="form-box">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="loginMsg"></p>
        </div>

        <div class="form-box">
            <h2>Register</h2>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Choose Username" required>
                <input type="password" id="regPassword" placeholder="Choose Password" required>
                <button type="submit">Register</button>
            </form>
            <p id="regMsg"></p>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
