<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Masters - LEGO Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">Brick Masters</div>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="login.html" id="loginLink">Login / Register</a>
            <a href="admin.html" id="adminLink" style="display: none;">Admin Panel</a>
            <a href="#" id="logoutBtn" style="display: none;">Logout</a>
        </div>
    </nav>

    <main class="store-layout">
        <div class="products-section">
            <h1>Welcome to the Ultimate LEGO Store</h1>
            
            <div id="weatherWidget" class="widget">Loading local delivery conditions...</div>

            <div class="widget" style="display: flex; gap: 20px; align-items: center;">
                <div class="currency-selector">
                    <label>Currency: </label>
                    <select id="currency">
                        <option value="ILS">ILS (₪)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                    </select>
                </div>
                <div class="sort-selector">
                    <label>Sort by: </label>
                    <select id="sortProducts">
                        <option value="name_asc">Name (A-Z)</option>
                        <option value="price_asc">Price (Low to High)</option>
                        <option value="price_desc">Price (High to Low)</option>
                    </select>
                </div>
            </div>

            <div class="products-grid" id="productsContainer">
                <p>Loading products...</p>
            </div>
        </div>

        <aside class="cart-section widget">
            <h2>Your Cart</h2>
            <div id="cartItemsContainer"></div>
            <hr>
            <h3>Total: ₪<span id="cartTotal">0.00</span></h3>
            <button id="checkoutBtn" style="background-color: #28a745; color: white;">Checkout</button>
        </aside>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
